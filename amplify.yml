version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8, Vitest 5 y jsdom piden Node 22 (Amplify trae uno más viejo).
        - nvm use 22 || nvm install 22
        - npm ci --legacy-peer-deps
    build:
      commands:
        # develop → dev.davidyero.com (`vite build --mode develop`); el resto, producción.
        - if [ "$AWS_BRANCH" = "develop" ]; then npm run build:develop; else npm run build; fi
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
